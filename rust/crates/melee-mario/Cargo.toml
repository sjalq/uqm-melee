[package]
name = "melee-mario"
version.workspace = true
edition.workspace = true

[[bin]]
name = "melee-mario"
path = "src/main.rs"

[lib]
name = "melee_mario"
path = "src/lib.rs"

[dependencies]
melee-core = { path = "../melee-core" }
melee-sim = { path = "../melee-sim" }
melee-neat = { path = "../melee-neat" }
# float_roundtrip makes decimal-to-f64 parsing correctly rounded. Without it a
# weight needing seventeen significant digits can come back one unit in the last
# place away from what was written, which changes a genome fingerprint and makes
# a resumed run a different run.
serde_json = { version = "1", features = ["float_roundtrip"] }
libc = "0.2"
